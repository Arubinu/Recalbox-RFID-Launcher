ll="#3fae4b"/><rect x="54" y="55" width="6" height="36" fill="#3fae4b"/><rect x="60" y="55" width="6" height="36" fill="#3fae4b"/><rect x="66" y="49" width="6" height="42" fill="#3fae4b"/><rect x="72" y="37" width="6" height="54" fill="#3fae4b"/><rect x="78" y="31" width="6" height="60" fill="#3fae4b"/><rect x="84" y="25" width="6" height="66" fill="#3fae4b"/><rect x="90" y="25" width="6" height="66" fill="#3fae4b"/><rect x="96" y="25" width="6" height="66" fill="#3fae4b"/><rect x="102" y="25" width="6" height="66" fill="#3fae4b"/><rect x="108" y="19" width="6" height="72" fill="#3fae4b"/><rect x="-114" y="61" width="228" height="30" fill="#8a4b1f"/><rect x="-114" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-96" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-90" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-72" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-66" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-48" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-42" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-24" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-18" y="61" width="6" height="6" fill="#3fae4b"/><rect x="0" y="61" width="6" height="6" fill="#3fae4b"/><rect x="6" y="61" width="6" height="6" fill="#3fae4b"/><rect x="24" y="61" width="6" height="6" fill="#3fae4b"/><rect x="30" y="61" width="6" height="6" fill="#3fae4b"/><rect x="48" y="61" width="6" height="6" fill="#3fae4b"/><rect x="54" y="61" width="6" height="6" fill="#3fae4b"/><rect x="72" y="61" width="6" height="6" fill="#3fae4b"/><rect x="78" y="61" width="6" height="6" fill="#3fae4b"/><rect x="96" y="61" width="6" height="6" fill="#3fae4b"/><rect x="102" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-48" y="43" width="12" height="18" fill="#8a4b1f"/><rect x="-48" y="37" width="12" height="6" fill="#fff3a8"/><rect x="12" y="19" width="36" height="6" fill="#8a4b1f"/><rect x="30" y="1" width="12" height="12" fill="#fff3a8"/></g>
      <rect x="-116" y="-85" width="232" height="178" fill="url(#glass)"/>
      <circle cx="-134" cy="-13.8" r="5" fill="url(#hLed)"/><circle cx="-134" cy="-13.8" r="13" fill="#3f6" opacity=".18"/></g>

