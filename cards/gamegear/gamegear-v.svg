      <rect x="-162" y="-127" width="324" height="254" rx="34" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-161" y="-126" width="322" height="252" rx="33" fill="none" stroke="#606062" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-150" y="-115" width="300" height="230" rx="22" fill="url(#hBezel)" stroke="#0d0d0f" stroke-width="1.5"/>
      
      <text x="0" y="-96" text-anchor="middle" font-family="'Segoe UI',Arial" font-style="italic" font-weight="700" font-size="10" letter-spacing="1.5" fill="#6f86c8">FULL COLOR</text>
      <rect x="-119" y="-88" width="238" height="184" rx="4" fill="#000" opacity=".55"/>
