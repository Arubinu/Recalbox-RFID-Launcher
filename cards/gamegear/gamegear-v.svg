      <path d="M48 542 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#18181a" stroke="#0c0c0d" filter="url(#soft)"/>
      <circle cx="57" cy="569" r="5.3999999999999995" fill="#0e0e10"/></g>
      <g id="aux2"><defs><radialGradient id="ab120" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#808082"/><stop offset=".55" stop-color="#2b2b2f"/><stop offset="1" stop-color="#18181a"/></radialGradient><radialGradient id="ab121" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#808082"/><stop offset=".55" stop-color="#2b2b2f"/><stop offset="1" stop-color="#18181a"/></radialGradient></defs><rect x="30" y="641" width="30" height="9" rx="4.5" fill="#2856c8" transform="rotate(-25 45 645)"/><rect x="68" y="641" width="30" height="9" rx="4.5" fill="#2856c8" transform="rotate(-25 83 645)"/><circle cx="123.6" cy="652" r="19" fill="url(#ab120)" filter="url(#soft)"/><circle cx="169" cy="638" r="19" fill="url(#ab121)" filter="url(#soft)"/></g>

