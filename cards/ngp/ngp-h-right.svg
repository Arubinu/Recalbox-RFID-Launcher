        <rect x="388" y="115" width="324" height="294" rx="62" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>

      <!-- détails -->
      <g id="aux1"><circle cx="525" cy="61" r="32" fill="#222e52"/>
      <path d="M516 34 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#c9c9cf" stroke="#656568" filter="url(#soft)"/>
      <circle cx="525" cy="61" r="5.3999999999999995" fill="#79797c"/></g>
      <g id="aux2"><defs><radialGradient id="ab640" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#dfdfe2"/><stop offset=".55" stop-color="#c9c9cf"/><stop offset="1" stop-color="#6f6f72"/></radialGradient><radialGradient id="ab641" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#dfdfe2"/><stop offset=".55" stop-color="#c9c9cf"/><stop offset="1" stop-color="#6f6f72"/></radialGradient></defs><rect x="498" y="485" width="30" height="9" rx="4.5" fill="#1c2642" transform="rotate(-25 513 489)"/><rect x="536" y="485" width="30" height="9" rx="4.5" fill="#1c2642" transform="rotate(-25 551 489)"/><circle cx="615.6" cy="496" r="19" fill="url(#ab640)" filter="url(#soft)"/><circle cx="661" cy="482" r="19" fill="url(#ab641)" filter="url(#soft)"/></g>

      <!-- motif principal -->
      <g id="hero" transform="translate(550 262) scale(1)"><defs><linearGradient id="hBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#445278"/><stop offset=".5" stop-color="#2b3a66"/><stop offset="1" stop-color="#222e52"/></linearGradient><linearGradient id="hBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c34"/><stop offset="1" stop-color="#15151c"/></linearGradient><radialGradient id="hLed" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#99ffb3"/><stop offset=".5" stop-color="#3f6"/><stop offset="1" stop-color="#1f993d"/></radialGradient><linearGradient id="hGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="-142" y="-127" width="284" height="254" rx="42" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-141" y="-126" width="282" height="252" rx="41" fill="none" stroke="#6b7594" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-130" y="-115" width="260" height="230" rx="30" fill="url(#hBezel)" stroke="#0e0e13" stroke-width="1.5"/>
      
      
      <rect x="-99" y="-88" width="198" height="184" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-96" y="-85" width="192" height="178" fill="#b8c4a8"/><rect x="60" y="-73.5" width="15" height="15" fill="#98a488"/><rect x="55" y="-68.5" width="25" height="5" fill="#98a488"/><rect x="60" y="-78.5" width="15" height="5" fill="#98a488"/><rect x="-80" y="-68.5" width="25" height="5" fill="#98a488"/><rect x="-75" y="-73.5" width="15" height="5" fill="#98a488"/><rect x="-95" y="16.5" width="5" height="75" fill="#4a5444"/><rect x="-90" y="16.5" width="5" height="75" fill="#4a5444"/><rect x="-85" y="21.5" width="5" height="70" fill="#4a5444"/><rect x="-80" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="-75" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="-70" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="-65" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="-60" y="31.5" width="5" height="60" fill="#4a5444"/><rect x="-55" y="41.5" width="5" height="50" fill="#4a5444"/><rect x="-50" y="51.5" width="5" height="40" fill="#4a5444"/><rect x="-45" y="56.5" width="5" height="35" fill="#4a5444"/><rect x="-40" y="56.5" width="5" height="35" fill="#4a5444"/><rect x="-35" y="51.5" width="5" height="40" fill="#4a5444"/><rect x="-30" y="46.5" width="5" height="45" fill="#4a5444"/><rect x="-25" y="41.5" width="5" height="50" fill="#4a5444"/><rect x="-20" y="41.5" width="5" height="50" fill="#4a5444"/><rect x="-15" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="-10" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="-5" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="0" y="21.5" width="5" height="70" fill="#4a5444"/><rect x="5" y="11.5" width="5" height="80" fill="#4a5444"/><rect x="10" y="11.5" width="5" height="80" fill="#4a5444"/><rect x="15" y="16.5" width="5" height="75" fill="#4a5444"/><rect x="20" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="25" y="31.5" width="5" height="60" fill="#4a5444"/><rect x="30" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="35" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="40" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="45" y="41.5" width="5" height="50" fill="#4a5444"/><rect x="50" y="51.5" width="5" height="40" fill="#4a5444"/><rect x="55" y="56.5" width="5" height="35" fill="#4a5444"/><rect x="60" y="56.5" width="5" height="35" fill="#4a5444"/><rect x="65" y="51.5" width="5" height="40" fill="#4a5444"/><rect x="70" y="46.5" width="5" height="45" fill="#4a5444"/><rect x="75" y="36.5" width="5" height="55" fill="#4a5444"/><rect x="80" y="31.5" width="5" height="60" fill="#4a5444"/><rect x="85" y="31.5" width="5" height="60" fill="#4a5444"/><rect x="90" y="26.5" width="5" height="65" fill="#4a5444"/><rect x="-95" y="61.5" width="190" height="30" fill="#1c241a"/><rect x="-95" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-80" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-75" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-60" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-55" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-40" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-35" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-20" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-15" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="0" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="5" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="20" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="25" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="40" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="45" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="60" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="65" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="80" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="85" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-40" y="46.5" width="10" height="15" fill="#1c241a"/><rect x="-40" y="41.5" width="10" height="5" fill="#98a488"/><rect x="10" y="26.5" width="30" height="5" fill="#1c241a"/><rect x="25" y="11.5" width="10" height="10" fill="#98a488"/></g>
      <rect x="-96" y="-85" width="192" height="178" fill="url(#glass)"/>
      <circle cx="-114" cy="-13.8" r="5" fill="url(#hLed)"/><circle cx="-114" cy="-13.8" r="13" fill="#3f6" opacity=".18"/></g>

      <rect width="856" height="540" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
