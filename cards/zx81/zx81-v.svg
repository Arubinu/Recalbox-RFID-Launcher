      <g id="aux2"><circle cx="40" cy="645" r="12" fill="#ff3b2a" opacity=".22"/><circle cx="40" cy="645" r="5" fill="#ff3b2a"/><circle cx="38.5" cy="643.5" r="1.6" fill="#fff" opacity=".7"/></g>

