      <rect x="0" y="0" width="540" height="856" fill="url(#tex)" opacity="0.6" />
      <rect width="540" height="856" filter="url(#noise)"/>

      <!-- encadré de la jaquette -->
      <g mask="url(#noCarve)">
        <path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7" transform="translate(0 2)"/>
        <path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
