      <g id="hero" transform="translate(336 548) scale(0.8)"><defs><linearGradient id="hCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303032"/><stop offset=".5" stop-color="#141416"/><stop offset="1" stop-color="#101011"/></linearGradient></defs>
      <rect x="-155" y="-105" width="310" height="210" rx="22" fill="url(#hCase)" filter="url(#drop)"/>
      <rect x="-139" y="-89" width="278" height="178" rx="10" fill="#0b0b0c"/>
      <rect x="-127.5" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-101.7" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-75.9" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-50.1" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-24.3" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="1.5" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="27.3" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="53.1" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="78.9" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="104.7" y="-77.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-117.18" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-91.38" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-65.58" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-39.78" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-13.98" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="11.82" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="37.62" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="63.42" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="89.22" y="-38" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-127.5" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-101.7" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-75.9" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-50.1" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-24.3" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="1.5" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="27.3" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="53.1" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="78.9" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="104.7" y="1.5" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-127.5" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-101.7" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-75.9" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-50.1" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="-24.3" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="1.5" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="27.3" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="53.1" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="78.9" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/><rect x="104.7" y="41" width="22.8" height="36.5" rx="2" fill="#1d1d20" stroke="#131315" stroke-width=".8"/></g>

      <rect width="540" height="856" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
