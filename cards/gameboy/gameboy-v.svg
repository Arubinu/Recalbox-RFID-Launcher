      <rect x="-157" y="-132" width="314" height="264" rx="34" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-156" y="-131" width="312" height="262" rx="33" fill="none" stroke="#d9d8d4" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-145" y="-120" width="290" height="240" rx="22" fill="url(#hBezel)" stroke="#33333e" stroke-width="1.5"/>
      <path d="M75 120 L145 50 V98 Q145 120 123 120 Z" fill="url(#hBody)"/>
      <rect x="-131" y="-112" width="262" height="2.2" fill="#8a2c5c"/><rect x="-131" y="-107" width="262" height="2.2" fill="#2d2e8a"/><text x="0" y="-101" text-anchor="middle" font-family="'Segoe UI',Arial" font-style="italic" font-weight="700" font-size="10" letter-spacing="1.5" fill="#c8c8d8">DOT MATRIX · STEREO SOUND</text>
      <rect x="-114" y="-91" width="228" height="192" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-111" y="-88" width="222" height="186" fill="#9bbc0f"/><rect x="69" y="-76" width="18" height="18" fill="#8bac0f"/><rect x="63" y="-70" width="30" height="6" fill="#8bac0f"/><rect x="69" y="-82" width="18" height="6" fill="#8bac0f"/><rect x="-93" y="-70" width="30" height="6" fill="#8bac0f"/><rect x="-87" y="-76" width="18" height="6" fill="#8bac0f"/><rect x="-111" y="20" width="6" height="78" fill="#306230"/><rect x="-105" y="20" width="6" height="78" fill="#306230"/><rect x="-99" y="26" width="6" height="72" fill="#306230"/><rect x="-93" y="26" width="6" height="72" fill="#306230"/><rect x="-87" y="26" width="6" height="72" fill="#306230"/><rect x="-81" y="26" width="6" height="72" fill="#306230"/><rect x="-75" y="32" width="6" height="66" fill="#306230"/><rect x="-69" y="38" width="6" height="60" fill="#306230"/><rect x="-63" y="44" width="6" height="54" fill="#306230"/><rect x="-57" y="56" width="6" height="42" fill="#306230"/><rect x="-51" y="62" width="6" height="36" fill="#306230"/><rect x="-45" y="62" width="6" height="36" fill="#306230"/><rect x="-39" y="56" width="6" height="42" fill="#306230"/><rect x="-33" y="50" width="6" height="48" fill="#306230"/><rect x="-27" y="44" width="6" height="54" fill="#306230"/><rect x="-21" y="44" width="6" height="54" fill="#306230"/><rect x="-15" y="44" width="6" height="54" fill="#306230"/><rect x="-9" y="38" width="6" height="60" fill="#306230"/><rect x="-3" y="32" width="6" height="66" fill="#306230"/><rect x="3" y="20" width="6" height="78" fill="#306230"/><rect x="9" y="14" width="6" height="84" fill="#306230"/><rect x="15" y="14" width="6" height="84" fill="#306230"/><rect x="21" y="20" width="6" height="78" fill="#306230"/><rect x="27" y="26" width="6" height="72" fill="#306230"/><rect x="33" y="38" width="6" height="60" fill="#306230"/><rect x="39" y="38" width="6" height="60" fill="#306230"/><rect x="45" y="38" width="6" height="60" fill="#306230"/><rect x="51" y="44" width="6" height="54" fill="#306230"/><rect x="57" y="50" width="6" height="48" fill="#306230"/><rect x="63" y="56" width="6" height="42" fill="#306230"/><rect x="69" y="62" width="6" height="36" fill="#306230"/><rect x="75" y="62" width="6" height="36" fill="#306230"/><rect x="81" y="56" width="6" height="42" fill="#306230"/><rect x="87" y="50" width="6" height="48" fill="#306230"/><rect x="93" y="38" width="6" height="60" fill="#306230"/><rect x="99" y="32" width="6" height="66" fill="#306230"/><rect x="105" y="32" width="6" height="66" fill="#306230"/><rect x="-111" y="68" width="222" height="30" fill="#0f380f"/><rect x="-111" y="68" width="6" height="6" fill="#306230"/><rect x="-93" y="68" width="6" height="6" fill="#306230"/><rect x="-87" y="68" width="6" height="6" fill="#306230"/><rect x="-69" y="68" width="6" height="6" fill="#306230"/><rect x="-63" y="68" width="6" height="6" fill="#306230"/><rect x="-45" y="68" width="6" height="6" fill="#306230"/><rect x="-39" y="68" width="6" height="6" fill="#306230"/><rect x="-21" y="68" width="6" height="6" fill="#306230"/><rect x="-15" y="68" width="6" height="6" fill="#306230"/><rect x="3" y="68" width="6" height="6" fill="#306230"/><rect x="9" y="68" width="6" height="6" fill="#306230"/><rect x="27" y="68" width="6" height="6" fill="#306230"/><rect x="33" y="68" width="6" height="6" fill="#306230"/><rect x="51" y="68" width="6" height="6" fill="#306230"/><rect x="57" y="68" width="6" height="6" fill="#306230"/><rect x="75" y="68" width="6" height="6" fill="#306230"/><rect x="81" y="68" width="6" height="6" fill="#306230"/><rect x="99" y="68" width="6" height="6" fill="#306230"/><rect x="105" y="68" width="6" height="6" fill="#306230"/><rect x="-45" y="50" width="12" height="18" fill="#0f380f"/><rect x="-45" y="44" width="12" height="6" fill="#8bac0f"/><rect x="9" y="26" width="36" height="6" fill="#0f380f"/><rect x="27" y="8" width="12" height="12" fill="#8bac0f"/></g>
      <rect x="-111" y="-88" width="222" height="186" fill="url(#glass)"/>
      <circle cx="-129" cy="-13.6" r="5" fill="url(#hLed)"/><circle cx="-129" cy="-13.6" r="13" fill="#e3262e" opacity=".18"/></g>

      <rect width="540" height="856" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
