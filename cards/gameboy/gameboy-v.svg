      <path d="M48 542 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#2a2a2c" stroke="#151516" filter="url(#soft)"/>
      <circle cx="57" cy="569" r="5.3999999999999995" fill="#19191a"/></g>
      <g id="aux2"><defs><radialGradient id="ab900" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#c27a9a"/><stop offset=".55" stop-color="#9a2257"/><stop offset="1" stop-color="#551330"/></radialGradient><radialGradient id="ab901" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#c27a9a"/><stop offset=".55" stop-color="#9a2257"/><stop offset="1" stop-color="#551330"/></radialGradient></defs><rect x="30" y="641" width="30" height="9" rx="4.5" fill="#8f8d88" transform="rotate(-25 45 645)"/><rect x="68" y="641" width="30" height="9" rx="4.5" fill="#8f8d88" transform="rotate(-25 83 645)"/><circle cx="123.6" cy="652" r="19" fill="url(#ab900)" filter="url(#soft)"/><circle cx="169" cy="638" r="19" fill="url(#ab901)" filter="url(#soft)"/></g>

