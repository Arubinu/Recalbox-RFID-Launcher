circle cx="70" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="79" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="88" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="97" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="106" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="115" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="124" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="133" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="142" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="151" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="160" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="169" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="178" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="187" cy="564" r="2.6" fill="#2a2a2e"/><circle cx="34" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="43" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="52" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="61" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="70" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="79" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="88" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="97" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="106" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="115" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="124" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="133" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="142" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="151" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="160" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="169" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="178" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="187" cy="573" r="2.6" fill="#2a2a2e"/><circle cx="34" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="43" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="52" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="61" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="70" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="79" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="88" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="97" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="106" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="115" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="124" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="133" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="142" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="151" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="160" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="169" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="178" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="187" cy="582" r="2.6" fill="#2a2a2e"/><circle cx="34" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="43" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="52" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="61" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="70" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="79" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="88" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="97" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="106" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="115" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="124" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="133" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="142" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="151" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="160" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="169" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="178" cy="591" r="2.6" fill="#2a2a2e"/><circle cx="187" cy="591" r="2.6" fill="#2a2a2e"/></g>
      <g id="aux2"><defs><radialGradient id="ab2040" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ee7d82"/><stop offset=".55" stop-color="#e3262e"/><stop offset="1" stop-color="#7d1519"/></radialGradient><radialGradient id="ab2041" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ee7d82"/><stop offset=".55" stop-color="#e3262e"/><stop offset="1" stop-color="#7d1519"/></radialGradient></defs><circle cx="123.6" cy="652" r="19" fill="url(#ab2040)" filter="url(#soft)"/><circle cx="169" cy="638" r="19" fill="url(#ab2041)" filter="url(#soft)"/></g>

      <!-- motif principal -->
      <g id="hero" transform="translate(336 548) scale(0.8)"><defs><linearGradient id="hCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303032"/><stop offset=".5" stop-color="#141416"/><stop offset="1" stop-color="#101011"/></linearGradient><linearGradient id="hGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="-140" y="-160" width="280" height="320" rx="34" fill="url(#hCase)" filter="url(#drop)"/>
      <rect x="-116" y="-138" width="232" height="266" rx="24" fill="#0b0b0c"/>
      <rect x="-100" y="-124" width="200" height="238" rx="18" fill="#000"/>
      <clipPath id="hScr"><rect x="-100" y="-124" width="200" height="238" rx="18"/></clipPath>
      <g clip-path="url(#hScr)"><rect x="-100" y="-124" width="200" height="238" fill="#05060a"/><g fill="none" stroke="#e8f4ff" stroke-width="2.2" filter="url(#glowW)"><path d="M0 -76.4 L24 -5 L0 -24.040000000000006 L-24 -5 Z"/><path d="M-70 54.5 L-40 23.560000000000002 L-10 66.4 L30 18.799999999999983 L70 61.640000000000015"/><circle cx="-60" cy="-64.5" r="10"/><path d="M56 -76.4 l14 8 l-14 8 l-14 -8 z"/></g><rect x="-100" y="-124" width="200" height="238" fill="url(#crtVignette)"/></g>
      <rect x="-100" y="-124" width="200" height="238" rx="18" fill="url(#glass)"/>
      <circle cx="100" cy="140" r="4" fill="#3f6"/>
      
      
      </g>

      <rect width="540" height="856" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
      <g id="spine">
        <rect x="0" y="670" width="540" height="30" fill="url(#spineShade)"/>
        <rect x="0" y="700" width="540" height="156" fill="url(#spineG)"/>
        
        <rect x="0" y="700" width="540" height="1.2" fill="#626263" opacity=".6"/>
