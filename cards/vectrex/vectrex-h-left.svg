    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1d20"/><stop offset=".6" stop-color="#121214"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
