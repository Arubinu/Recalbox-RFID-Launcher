<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 856" width="54mm" height="85.6mm">
  <title>WASM-4 — carte verticale, languette en bas</title>
  <defs>
    <clipPath id="card"><rect width="540" height="856" rx="31.8"/></clipPath>
    <clipPath id="win"><path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z"/></clipPath>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="856"><rect width="540" height="856" fill="#fff"/><path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="#000"/><rect x="202.4" y="414.4" width="267.2" height="267.2" rx="44" fill="#fff"/></mask>
    <mask id="noCarve" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="856"><rect width="540" height="856" fill="#fff"/><rect x="202.4" y="414.4" width="267.2" height="267.2" rx="44" fill="#000"/></mask>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3060"/><stop offset=".6" stop-color="#2a2248"/><stop offset="1" stop-color="#1a1530"/></linearGradient>
    <linearGradient id="spineG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0916"/><stop offset=".08" stop-color="#312c45"/><stop offset=".5" stop-color="#1a1530"/><stop offset="1" stop-color="#110e1f"/></linearGradient>
    <linearGradient id="spineShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></linearGradient>
    <linearGradient id="fadeG" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="530"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="fadeM" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="856"><rect width="540" height="856" fill="url(#fadeG)"/></mask>
    <pattern id="tex" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M17 0H0V17" fill="none" stroke="#86c06c" stroke-width="1.1"/></pattern>
    
    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcdcae"/><stop offset="0.45" stop-color="#86c06c"/><stop offset="0.52" stop-color="#577d46"/><stop offset="1" stop-color="#9ecd89"/></linearGradient>
    <linearGradient id="filetG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#86c06c" stop-opacity="0"/><stop offset=".5" stop-color="#86c06c"/><stop offset="1" stop-color="#86c06c" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2=".62"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".46" stop-color="#fff" stop-opacity=".07"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
