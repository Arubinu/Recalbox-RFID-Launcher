      <rect x="-160" y="-135" width="320" height="270" rx="34" fill="url(#hCase)" filter="url(#drop)"/>
      <rect x="-136" y="-113" width="272" height="216" rx="24" fill="#202023"/>
      <rect x="-120" y="-99" width="240" height="188" rx="18" fill="#000"/>
      <clipPath id="hScr"><rect x="-120" y="-99" width="240" height="188" rx="18"/></clipPath>
      <g clip-path="url(#hScr)"><rect x="-120" y="-99" width="240" height="188" fill="#120a00"/><text x="-108" y="-67.75" font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="15" fill="#ffb000">WEST OF HOUSE</text><text x="-108" y="-50.5" font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="15" fill="#ffb000">You are standing</text><text x="-108" y="-33.25000000000001" font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="15" fill="#ffb000">in an open field.</text><text x="-108" y="-16" font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="15" fill="#ffb000">>open mailbox_</text><rect x="-120" y="-99" width="240" height="188" fill="url(#scan)" opacity=".5"/><rect x="-120" y="-99" width="240" height="188" fill="url(#crtVignette)"/></g>
      <rect x="-120" y="-99" width="240" height="188" rx="18" fill="url(#glass)"/>
      <circle cx="120" cy="115" r="4" fill="#3f6"/>
      
      
      </g>

      <rect width="540" height="856" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
