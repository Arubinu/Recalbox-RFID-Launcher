        <rect x="0" y="670" width="540" height="30" fill="url(#spineShade)"/>
        <rect x="0" y="700" width="540" height="156" fill="url(#spineG)"/>
        
        <rect x="0" y="700" width="540" height="1.2" fill="#626264" opacity=".6"/>
