circle cx="70" cy="564" r="2.6" fill="#3a2a10"/><circle cx="79" cy="564" r="2.6" fill="#3a2a10"/><circle cx="88" cy="564" r="2.6" fill="#3a2a10"/><circle cx="97" cy="564" r="2.6" fill="#3a2a10"/><circle cx="106" cy="564" r="2.6" fill="#3a2a10"/><circle cx="115" cy="564" r="2.6" fill="#3a2a10"/><circle cx="124" cy="564" r="2.6" fill="#3a2a10"/><circle cx="133" cy="564" r="2.6" fill="#3a2a10"/><circle cx="142" cy="564" r="2.6" fill="#3a2a10"/><circle cx="151" cy="564" r="2.6" fill="#3a2a10"/><circle cx="160" cy="564" r="2.6" fill="#3a2a10"/><circle cx="169" cy="564" r="2.6" fill="#3a2a10"/><circle cx="178" cy="564" r="2.6" fill="#3a2a10"/><circle cx="187" cy="564" r="2.6" fill="#3a2a10"/><circle cx="34" cy="573" r="2.6" fill="#3a2a10"/><circle cx="43" cy="573" r="2.6" fill="#3a2a10"/><circle cx="52" cy="573" r="2.6" fill="#3a2a10"/><circle cx="61" cy="573" r="2.6" fill="#3a2a10"/><circle cx="70" cy="573" r="2.6" fill="#3a2a10"/><circle cx="79" cy="573" r="2.6" fill="#3a2a10"/><circle cx="88" cy="573" r="2.6" fill="#3a2a10"/><circle cx="97" cy="573" r="2.6" fill="#3a2a10"/><circle cx="106" cy="573" r="2.6" fill="#3a2a10"/><circle cx="115" cy="573" r="2.6" fill="#3a2a10"/><circle cx="124" cy="573" r="2.6" fill="#3a2a10"/><circle cx="133" cy="573" r="2.6" fill="#3a2a10"/><circle cx="142" cy="573" r="2.6" fill="#3a2a10"/><circle cx="151" cy="573" r="2.6" fill="#3a2a10"/><circle cx="160" cy="573" r="2.6" fill="#3a2a10"/><circle cx="169" cy="573" r="2.6" fill="#3a2a10"/><circle cx="178" cy="573" r="2.6" fill="#3a2a10"/><circle cx="187" cy="573" r="2.6" fill="#3a2a10"/><circle cx="34" cy="582" r="2.6" fill="#3a2a10"/><circle cx="43" cy="582" r="2.6" fill="#3a2a10"/><circle cx="52" cy="582" r="2.6" fill="#3a2a10"/><circle cx="61" cy="582" r="2.6" fill="#3a2a10"/><circle cx="70" cy="582" r="2.6" fill="#3a2a10"/><circle cx="79" cy="582" r="2.6" fill="#3a2a10"/><circle cx="88" cy="582" r="2.6" fill="#3a2a10"/><circle cx="97" cy="582" r="2.6" fill="#3a2a10"/><circle cx="106" cy="582" r="2.6" fill="#3a2a10"/><circle cx="115" cy="582" r="2.6" fill="#3a2a10"/><circle cx="124" cy="582" r="2.6" fill="#3a2a10"/><circle cx="133" cy="582" r="2.6" fill="#3a2a10"/><circle cx="142" cy="582" r="2.6" fill="#3a2a10"/><circle cx="151" cy="582" r="2.6" fill="#3a2a10"/><circle cx="160" cy="582" r="2.6" fill="#3a2a10"/><circle cx="169" cy="582" r="2.6" fill="#3a2a10"/><circle cx="178" cy="582" r="2.6" fill="#3a2a10"/><circle cx="187" cy="582" r="2.6" fill="#3a2a10"/><circle cx="34" cy="591" r="2.6" fill="#3a2a10"/><circle cx="43" cy="591" r="2.6" fill="#3a2a10"/><circle cx="52" cy="591" r="2.6" fill="#3a2a10"/><circle cx="61" cy="591" r="2.6" fill="#3a2a10"/><circle cx="70" cy="591" r="2.6" fill="#3a2a10"/><circle cx="79" cy="591" r="2.6" fill="#3a2a10"/><circle cx="88" cy="591" r="2.6" fill="#3a2a10"/><circle cx="97" cy="591" r="2.6" fill="#3a2a10"/><circle cx="106" cy="591" r="2.6" fill="#3a2a10"/><circle cx="115" cy="591" r="2.6" fill="#3a2a10"/><circle cx="124" cy="591" r="2.6" fill="#3a2a10"/><circle cx="133" cy="591" r="2.6" fill="#3a2a10"/><circle cx="142" cy="591" r="2.6" fill="#3a2a10"/><circle cx="151" cy="591" r="2.6" fill="#3a2a10"/><circle cx="160" cy="591" r="2.6" fill="#3a2a10"/><circle cx="169" cy="591" r="2.6" fill="#3a2a10"/><circle cx="178" cy="591" r="2.6" fill="#3a2a10"/><circle cx="187" cy="591" r="2.6" fill="#3a2a10"/></g>
