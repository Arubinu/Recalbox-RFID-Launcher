    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c3a5c"/><stop offset=".6" stop-color="#1d2742"/><stop offset="1" stop-color="#111729"/></linearGradient>
