<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="85.6mm" height="54mm">
  <title>LYNX — carte horizontale, languette à droite</title>
  <defs>
    <clipPath id="card"><rect width="856" height="540" rx="31.8"/></clipPath>
    <clipPath id="win"><path d="M40 24 H456 Q472 24 472 40 V434 Q472 450 456 450 H40 Q24 450 24 434 V40 Q24 24 40 24 Z"/></clipPath>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="856" height="540"><rect width="856" height="540" fill="#fff"/><path d="M40 24 H456 Q472 24 472 40 V434 Q472 450 456 450 H40 Q24 450 24 434 V40 Q24 24 40 24 Z" fill="#000"/><rect x="328" y="130" width="384" height="264" rx="82" fill="#fff"/></mask>
    <mask id="noCarve" maskUnits="userSpaceOnUse" x="0" y="0" width="856" height="540"><rect width="856" height="540" fill="#fff"/><rect x="328" y="130" width="384" height="264" rx="82" fill="#000"/></mask>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1d20"/><stop offset=".6" stop-color="#121214"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
