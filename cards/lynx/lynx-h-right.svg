ll="#d04a3a"/><rect x="45" y="42.5" width="5" height="35" fill="#d04a3a"/><rect x="50" y="47.5" width="5" height="30" fill="#d04a3a"/><rect x="55" y="47.5" width="5" height="30" fill="#d04a3a"/><rect x="60" y="37.5" width="5" height="40" fill="#d04a3a"/><rect x="65" y="32.5" width="5" height="45" fill="#d04a3a"/><rect x="70" y="22.5" width="5" height="55" fill="#d04a3a"/><rect x="75" y="17.5" width="5" height="60" fill="#d04a3a"/><rect x="80" y="17.5" width="5" height="60" fill="#d04a3a"/><rect x="85" y="17.5" width="5" height="60" fill="#d04a3a"/><rect x="-90" y="52.5" width="180" height="25" fill="#3a1a2a"/><rect x="-90" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-75" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-70" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-55" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-50" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-35" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-30" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-15" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-10" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="5" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="10" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="25" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="30" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="45" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="50" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="65" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="70" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="85" y="52.5" width="5" height="5" fill="#d04a3a"/><rect x="-35" y="37.5" width="10" height="15" fill="#3a1a2a"/><rect x="-35" y="32.5" width="10" height="5" fill="#ffe08a"/><rect x="10" y="17.5" width="30" height="5" fill="#3a1a2a"/><rect x="20" y="2.5" width="10" height="10" fill="#ffe08a"/></g>
