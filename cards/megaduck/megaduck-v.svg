      <rect x="-152" y="-132" width="304" height="264" rx="34" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-151" y="-131" width="302" height="262" rx="33" fill="none" stroke="#6d6d70" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-140" y="-120" width="280" height="240" rx="22" fill="url(#hBezel)" stroke="#0e0e10" stroke-width="1.5"/>
      
      <text x="0" y="-101" text-anchor="middle" font-family="'Segoe UI',Arial" font-style="italic" font-weight="700" font-size="10" letter-spacing="1.5" fill="#f5c61b">DUCK</text>
      <rect x="-109" y="-93" width="218" height="194" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-106" y="-90" width="212" height="188" fill="#9bbc0f"/><rect x="63" y="-77" width="18" height="18" fill="#8bac0f"/><rect x="57" y="-71" width="30" height="6" fill="#8bac0f"/><rect x="63" y="-83" width="18" height="6" fill="#8bac0f"/><rect x="-87" y="-71" width="30" height="6" fill="#8bac0f"/><rect x="-81" y="-77" width="18" height="6" fill="#8bac0f"/><rect x="-105" y="19" width="6" height="78" fill="#306230"/><rect x="-99" y="19" width="6" height="78" fill="#306230"/><rect x="-93" y="25" width="6" height="72" fill="#306230"/><rect x="-87" y="25" width="6" height="72" fill="#306230"/><rect x="-81" y="25" width="6" height="72" fill="#306230"/><rect x="-75" y="25" width="6" height="72" fill="#306230"/><rect x="-69" y="31" width="6" height="66" fill="#306230"/><rect x="-63" y="37" width="6" height="60" fill="#306230"/><rect x="-57" y="43" width="6" height="54" fill="#306230"/><rect x="-51" y="55" width="6" height="42" fill="#306230"/><rect x="-45" y="61" width="6" height="36" fill="#306230"/><rect x="-39" y="61" width="6" height="36" fill="#306230"/><rect x="-33" y="55" width="6" height="42" fill="#306230"/><rect x="-27" y="49" width="6" height="48" fill="#306230"/><rect x="-21" y="43" width="6" height="54" fill="#306230"/><rect x="-15" y="43" width="6" height="54" fill="#306230"/><rect x="-9" y="43" width="6" height="54" fill="#306230"/><rect x="-3" y="37" width="6" height="60" fill="#306230"/><rect x="3" y="31" width="6" height="66" fill="#306230"/><rect x="9" y="19" width="6" height="78" fill="#306230"/><rect x="15" y="13" width="6" height="84" fill="#306230"/><rect x="21" y="13" width="6" height="84" fill="#306230"/><rect x="27" y="19" width="6" height="78" fill="#306230"/><rect x="33" y="25" width="6" height="72" fill="#306230"/><rect x="39" y="37" width="6" height="60" fill="#306230"/><rect x="45" y="37" width="6" height="60" fill="#306230"/><rect x="51" y="37" width="6" height="60" fill="#306230"/><rect x="57" y="43" width="6" height="54" fill="#306230"/><rect x="63" y="49" width="6" height="48" fill="#306230"/><rect x="69" y="55" width="6" height="42" fill="#306230"/><rect x="75" y="61" width="6" height="36" fill="#306230"/><rect x="81" y="61" width="6" height="36" fill="#306230"/><rect x="87" y="55" width="6" height="42" fill="#306230"/><rect x="93" y="49" width="6" height="48" fill="#306230"/><rect x="99" y="37" width="6" height="60" fill="#306230"/><rect x="-105" y="67" width="210" height="30" fill="#0f380f"/><rect x="-105" y="67" width="6" height="6" fill="#306230"/><rect x="-87" y="67" width="6" height="6" fill="#306230"/><rect x="-81" y="67" width="6" height="6" fill="#306230"/><rect x="-63" y="67" width="6" height="6" fill="#306230"/><rect x="-57" y="67" width="6" height="6" fill="#306230"/><rect x="-39" y="67" width="6" height="6" fill="#306230"/><rect x="-33" y="67" width="6" height="6" fill="#306230"/><rect x="-15" y="67" width="6" height="6" fill="#306230"/><rect x="-9" y="67" width="6" height="6" fill="#306230"/><rect x="9" y="67" width="6" height="6" fill="#306230"/><rect x="15" y="67" width="6" height="6" fill="#306230"/><rect x="33" y="67" width="6" height="6" fill="#306230"/><rect x="39" y="67" width="6" height="6" fill="#306230"/><rect x="57" y="67" width="6" height="6" fill="#306230"/><rect x="63" y="67" width="6" height="6" fill="#306230"/><rect x="81" y="67" width="6" height="6" fill="#306230"/><rect x="87" y="67" width="6" height="6" fill="#306230"/><rect x="105" y="67" width="6" height="6" fill="#306230"/><rect x="-39" y="49" width="12" height="18" fill="#0f380f"/><rect x="-39" y="43" width="12" height="6" fill="#8bac0f"/><rect x="9" y="25" width="36" height="6" fill="#0f380f"/><rect x="27" y="7" width="12" height="12" fill="#8bac0f"/></g>
      <rect x="-106" y="-90" width="212" height="188" fill="url(#glass)"/>
      <circle cx="-124" cy="-14.8" r="5" fill="url(#hLed)"/><circle cx="-124" cy="-14.8" r="13" fill="#ff3b2a" opacity=".18"/></g>

