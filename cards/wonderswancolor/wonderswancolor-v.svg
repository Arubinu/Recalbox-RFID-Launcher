      <rect x="0" y="0" width="540" height="856" fill="url(#tex)" opacity="0.12" />
      <rect width="540" height="856" filter="url(#noise)"/>

      <!-- encadré de la jaquette -->
      <g mask="url(#noCarve)">
        <path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7" transform="translate(0 2)"/>
        <path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>
      <g clip-path="url(#win)">
        <rect x="178.4" y="438.4" width="315.2" height="219.2" rx="53.6" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7"/>
        <rect x="178.4" y="438.4" width="315.2" height="219.2" rx="53.6" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>

      <!-- détails -->
      <g id="aux1"><circle cx="57" cy="569" r="32" fill="#265999"/>
      <path d="M48 542 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#1a2232" stroke="#0d1119" filter="url(#soft)"/>
      <circle cx="57" cy="569" r="5.3999999999999995" fill="#10141e"/></g>
      <g id="aux2"><defs><radialGradient id="ab2220" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#767a84"/><stop offset=".55" stop-color="#1a2232"/><stop offset="1" stop-color="#0e131c"/></radialGradient><radialGradient id="ab2221" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#767a84"/><stop offset=".55" stop-color="#1a2232"/><stop offset="1" stop-color="#0e131c"/></radialGradient></defs><rect x="30" y="641" width="30" height="9" rx="4.5" fill="#1f487c" transform="rotate(-25 45 645)"/><rect x="68" y="641" width="30" height="9" rx="4.5" fill="#1f487c" transform="rotate(-25 83 645)"/><circle cx="123.6" cy="652" r="19" fill="url(#ab2220)" filter="url(#soft)"/><circle cx="169" cy="638" r="19" fill="url(#ab2221)" filter="url(#soft)"/></g>

      <!-- motif principal -->
      <g id="hero" transform="translate(336 548) scale(0.8)"><defs><linearGradient id="hBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4880c7"/><stop offset=".5" stop-color="#2f6fbf"/><stop offset="1" stop-color="#265999"/></linearGradient><linearGradient id="hBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3442"/><stop offset="1" stop-color="#151c29"/></linearGradient><radialGradient id="hLed" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff8080"/><stop offset=".5" stop-color="#f00"/><stop offset="1" stop-color="#990000"/></radialGradient><linearGradient id="hGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="-172" y="-112" width="344" height="224" rx="42" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-171" y="-111" width="342" height="222" rx="41" fill="none" stroke="#6d9ad2" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-160" y="-100" width="320" height="200" rx="30" fill="url(#hBezel)" stroke="#0e131c" stroke-width="1.5"/>
      
      
      <rect x="-103" y="-79" width="206" height="158" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-100" y="-76" width="200" height="152" fill="#7ec8ff"/><rect x="57" y="-63" width="18" height="18" fill="#fff3a8"/><rect x="51" y="-57" width="30" height="6" fill="#fff3a8"/><rect x="57" y="-69" width="18" height="6" fill="#fff3a8"/><rect x="-81" y="-57" width="30" height="6" fill="#fff3a8"/><rect x="-75" y="-63" width="18" height="6" fill="#fff3a8"/><rect x="-99" y="15" width="6" height="60" fill="#3fae4b"/><rect x="-93" y="21" width="6" height="54" fill="#3fae4b"/><rect x="-87" y="21" width="6" height="54" fill="#3fae4b"/><rect x="-81" y="21" width="6" height="54" fill="#3fae4b"/><rect x="-75" y="27" width="6" height="48" fill="#3fae4b"/><rect x="-69" y="33" width="6" height="42" fill="#3fae4b"/><rect x="-63" y="39" width="6" height="36" fill="#3fae4b"/><rect x="-57" y="45" width="6" height="30" fill="#3fae4b"/><rect x="-51" y="45" width="6" height="30" fill="#3fae4b"/><rect x="-45" y="45" width="6" height="30" fill="#3fae4b"/><rect x="-39" y="39" width="6" height="36" fill="#3fae4b"/><rect x="-33" y="33" width="6" height="42" fill="#3fae4b"/><rect x="-27" y="27" width="6" height="48" fill="#3fae4b"/><rect x="-21" y="27" width="6" height="48" fill="#3fae4b"/><rect x="-15" y="27" width="6" height="48" fill="#3fae4b"/><rect x="-9" y="21" width="6" height="54" fill="#3fae4b"/><rect x="-3" y="15" width="6" height="60" fill="#3fae4b"/><rect x="3" y="9" width="6" height="66" fill="#3fae4b"/><rect x="9" y="9" width="6" height="66" fill="#3fae4b"/><rect x="15" y="9" width="6" height="66" fill="#3fae4b"/><rect x="21" y="15" width="6" height="60" fill="#3fae4b"/><rect x="27" y="21" width="6" height="54" fill="#3fae4b"/><rect x="33" y="27" width="6" height="48" fill="#3fae4b"/><rect x="39" y="33" width="6" height="42" fill="#3fae4b"/><rect x="45" y="33" width="6" height="42" fill="#3fae4b"/><rect x="51" y="33" width="6" height="42" fill="#3fae4b"/><rect x="57" y="39" width="6" height="36" fill="#3fae4b"/><rect x="63" y="45" width="6" height="30" fill="#3fae4b"/><rect x="69" y="45" width="6" height="30" fill="#3fae4b"/><rect x="75" y="45" width="6" height="30" fill="#3fae4b"/><rect x="81" y="39" width="6" height="36" fill="#3fae4b"/><rect x="87" y="27" width="6" height="48" fill="#3fae4b"/><rect x="93" y="21" width="6" height="54" fill="#3fae4b"/><rect x="-99" y="51" width="198" height="24" fill="#8a4b1f"/><rect x="-99" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-81" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-75" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-57" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-51" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-33" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-27" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-9" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-3" y="51" width="6" height="6" fill="#3fae4b"/><rect x="15" y="51" width="6" height="6" fill="#3fae4b"/><rect x="21" y="51" width="6" height="6" fill="#3fae4b"/><rect x="39" y="51" width="6" height="6" fill="#3fae4b"/><rect x="45" y="51" width="6" height="6" fill="#3fae4b"/><rect x="63" y="51" width="6" height="6" fill="#3fae4b"/><rect x="69" y="51" width="6" height="6" fill="#3fae4b"/><rect x="87" y="51" width="6" height="6" fill="#3fae4b"/><rect x="93" y="51" width="6" height="6" fill="#3fae4b"/><rect x="-39" y="33" width="12" height="18" fill="#8a4b1f"/><rect x="-39" y="27" width="12" height="6" fill="#fff3a8"/><rect x="9" y="9" width="36" height="6" fill="#8a4b1f"/><rect x="21" y="-9" width="12" height="12" fill="#fff3a8"/></g>
      <rect x="-100" y="-76" width="200" height="152" fill="url(#glass)"/>
      </g>

      <rect width="540" height="856" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
      <g id="spine">
        <rect x="0" y="670" width="540" height="30" fill="url(#spineShade)"/>
        <rect x="0" y="700" width="540" height="156" fill="url(#spineG)"/>
        
        <rect x="0" y="700" width="540" height="1.2" fill="#6d8db9" opacity=".6"/>
      </g>
    </g>
    <rect x="24" y="38" width="40" height="1.6" fill="url(#filetG)"/>
    <rect x="476" y="38" width="40" height="1.6" fill="url(#filetG)"/>
  </g>
</svg>
