<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 856" width="54mm" height="85.6mm">
  <title>THOMSON — carte verticale, languette en bas</title>
  <defs>
    <clipPath id="card"><rect width="540" height="856" rx="31.8"/></clipPath>
    <clipPath id="win"><path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z"/></clipPath>
