    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2d5da"/><stop offset=".6" stop-color="#b9bdc4"/><stop offset="1" stop-color="#959aa3"/></linearGradient>
    <linearGradient id="spineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1b1f"/><stop offset=".08" stop-color="#4e5057"/><stop offset=".5" stop-color="#3a3d44"/><stop offset="1" stop-color="#26282c"/></linearGradient>
