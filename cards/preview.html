<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cartes — aperçu</title>
<style>
  body { margin: 0; padding: 40px; background: radial-gradient(circle at 30% 20%, #3a2a1e, #1a120c 70%); font-family: "Segoe UI", system-ui, sans-serif; color: #bbb;
         display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px; width: 1792px; }
  .card { position: relative; flex: none; border-radius: 31.8px; overflow: hidden;
          box-shadow: 0 22px 40px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5); }
  .card > * { position: absolute; }
  .cover { object-fit: cover; }
  .frame { inset: 0; width: 100%; height: 100%; }
  .z { display: flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
  .logo { font: 400 34px/1 "Bahnschrift", sans-serif; font-stretch: condensed; letter-spacing: 9px; color: #eee;
          text-shadow: 0 1px 0 #000; }
  .title { font: 700 40px/1.12 "Bahnschrift", "Segoe UI", sans-serif; font-stretch: condensed; color: #fff; text-transform: uppercase;
           letter-spacing: 1px; text-shadow: 0 2px 3px #000; }
  .rot > div { flex: none; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px; box-sizing: border-box; }
  .players { font: 700 26px/1 "Bahnschrift"; color: #fff; gap: 6px; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.35); border-radius: 28px; }
  .players:empty { display: none }
  .players svg { width: 26px; height: 26px; fill: currentColor }
  .slogo { font: 700 italic 22px/1 "Arial Black"; color: #e9e9ee; letter-spacing: 1px; }
  .guides .z { outline: 2px dashed rgba(255,0,170,.85); outline-offset: -2px; }
  /* simulation : carte insérée, seule la languette dépasse */
  .reader { position: relative; flex: none; }
  .reader.bottom .box { left: -20px; right: -20px; top: -20px; bottom: auto; width: auto; height: 720px; }
  .reader.bottom .box::after { left: 34px; right: 34px; top: auto; bottom: 10px; width: auto; height: 10px; }
  .reader .card { position: absolute; top: 0; }
  .reader .box { position: absolute; top: -20px; bottom: -20px; width: 700px; border-radius: 24px;
                 background: linear-gradient(#2c2c30, #151517); box-shadow: inset 0 1px 0 #555, 0 20px 40px rgba(0,0,0,.6); z-index: 2; }
  .reader .box::after { content: ""; position: absolute; top: 34px; bottom: 34px; width: 10px; background: #000; border-radius: 5px; }
  .reader.right .box { left: 0 } .reader.right .box::after { right: 10px }
  .reader.left .box { right: 0 } .reader.left .box::after { left: 10px }
  .reader.right .card { left: 0 } .reader.left .card { left: 0 }
  h2 { flex: 0 0 100%; margin: 0 0 -24px; font-weight: 600; font-size: 18px; color: #c9b8a8 }
</style>
</head>
<body>
<script src="zones.js"></script>
<script>
// Jaquette factice (illustration abstraite, format portrait) — à remplacer par la vraie
const fakeCover = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600">
<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a8c"/><stop offset=".6" stop-color="#3fa2e6"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient></defs>
<rect width="450" height="600" fill="url(#s)"/><circle cx="330" cy="150" r="60" fill="#fff3b0"/>
<path d="M0 400 L110 300 L190 360 L300 250 L450 380 V600 H0Z" fill="#26407a"/>
<path d="M0 470 Q120 420 240 460 T450 450 V600 H0Z" fill="#14234a"/>
<path d="M60 600 L215 420 L235 420 L390 600Z" fill="#3a3f55"/><path d="M222 430 V600" stroke="#ffd400" stroke-width="6" stroke-dasharray="22 18"/>
<g transform="translate(150 470)"><path d="M10 60 L40 15 H110 L140 60 Z" fill="#e23b2e"/><path d="M48 22 H102 L118 48 H32 Z" fill="#9fd6ff"/>
<rect x="0" y="58" width="150" height="34" rx="8" fill="#c02a20"/><circle cx="30" cy="94" r="16" fill="#111"/><circle cx="120" cy="94" r="16" fill="#111"/></g>
<text x="225" y="560" text-anchor="middle" font-family="Impact,Arial Black" font-size="58" fill="#ffd400" stroke="#1a2a8c" stroke-width="4" paint-order="stroke">TURBO RUN</text>
</svg>`);

const person = '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.5"/><path d="M3 22c0-5 4-8.5 9-8.5s9 3.5 9 8.5z"/></svg>';
if (new URLSearchParams(location.search).has('guides')) document.body.classList.add('guides');

const C = new URLSearchParams(location.search).get('c') || 'megadrive';
function card(id, variant, title, players) {
  const P = ZONES[id], z = P.variants[variant], st = z.style;
  const el = document.createElement('div');
  el.className = 'card';
  el.style.cssText = `width:${z.viewBox[0]}px;height:${z.viewBox[1]}px`;
  const pos = r => `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
  const rot = r => `<div style="width:${r.h}px;height:${r.w}px;transform:rotate(${r.rotate}deg)">`;
  el.innerHTML = `
    <img class="cover" style="${pos(z.cover)}" src="${fakeCover}">
    <img class="frame" src="${id}/${id}-${variant}.svg">
    <div class="z logo" style="${pos(z.logo)};color:${st.logoColor}">${P.name}</div>
    <div class="z title rot" style="${pos(z.title)};color:${st.titleColor}">${z.title.rotate ? rot(z.title) : '<div style="width:100%;height:100%">'}${title}</div></div>
    <div class="z players" style="${pos(z.players)};color:${st.titleColor};border-color:currentColor">${players ? person + players : ''}</div>
    <div class="z slogo" style="${pos(z.spineLogo)};color:${st.titleColor}">${P.short}</div>`;
  return el;
}
const h = t => Object.assign(document.createElement('h2'), { textContent: t });

function reader(variant, title, players) {
  const r = document.createElement('div');
  r.className = 'reader ' + { 'h-right': 'right', 'h-left': 'left', v: 'bottom' }[variant];
  const c = card(C, variant, title, players);
  r.style.cssText = c.style.cssText;
  r.append(c, Object.assign(document.createElement('div'), { className: 'box' }));
  return r;
}
document.body.append(
  h('Horizontale — languette à droite / à gauche (fente sur le côté du boîtier)'),
  card(C, 'h-right', 'Turbo Run', '1-2'),
  card(C, 'h-left', 'Le Royaume des Étoiles', '1-4'),
  h('Dans le lecteur — seule la languette dépasse'),
  reader('h-right', 'Turbo Run', '1-2'),
  reader('h-left', 'Le Royaume des Étoiles', ''),
  h('Verticale — languette en bas (fente en façade du boîtier)'),
  card(C, 'v', 'Turbo Run', '1-2'),
  reader('v', 'Turbo Run', '1-2'),
);
</script>
</body>
</html>
