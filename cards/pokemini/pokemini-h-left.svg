      <rect x="0" y="0" width="856" height="540" fill="url(#tex)" opacity="0.12" />
      <rect width="856" height="540" filter="url(#noise)"/>

      <!-- encadré de la jaquette -->
      <g mask="url(#noCarve)">
        <path d="M400 24 H816 Q832 24 832 40 V434 Q832 450 816 450 H400 Q384 450 384 434 V40 Q384 24 400 24 Z" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7" transform="translate(0 2)"/>
        <path d="M400 24 H816 Q832 24 832 40 V434 Q832 450 816 450 H400 Q384 450 384 434 V40 Q384 24 400 24 Z" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>
      <g clip-path="url(#win)">
        <rect x="144" y="120" width="314" height="284" rx="72" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7"/>
        <rect x="144" y="120" width="314" height="284" rx="72" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>

      <!-- détails -->
      <g id="aux1"><circle cx="209" cy="61" r="32" fill="#265d9a"/>
      <path d="M200 34 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#24324a" stroke="#121925" filter="url(#soft)"/>
      <circle cx="209" cy="61" r="5.3999999999999995" fill="#161e2c"/></g>
      <g id="aux2"><defs><radialGradient id="ab530" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#7c8492"/><stop offset=".55" stop-color="#24324a"/><stop offset="1" stop-color="#141c29"/></radialGradient><radialGradient id="ab531" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#7c8492"/><stop offset=".55" stop-color="#24324a"/><stop offset="1" stop-color="#141c29"/></radialGradient></defs><rect x="176" y="485" width="30" height="9" rx="4.5" fill="#1f4b7d" transform="rotate(-25 191 489)"/><rect x="214" y="485" width="30" height="9" rx="4.5" fill="#1f4b7d" transform="rotate(-25 229 489)"/><circle cx="293.6" cy="496" r="19" fill="url(#ab530)" filter="url(#soft)"/><circle cx="339" cy="482" r="19" fill="url(#ab531)" filter="url(#soft)"/></g>

      <!-- motif principal -->
      <g id="hero" transform="translate(301 262) scale(1)"><defs><linearGradient id="hBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4885c8"/><stop offset=".5" stop-color="#2f74c0"/><stop offset="1" stop-color="#265d9a"/></linearGradient><linearGradient id="hBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#364258"/><stop offset="1" stop-color="#1e293d"/></linearGradient><radialGradient id="hLed" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#fae38d"/><stop offset=".5" stop-color="#f5c61b"/><stop offset="1" stop-color="#937710"/></radialGradient><linearGradient id="hGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="-137" y="-122" width="274" height="244" rx="52" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-136" y="-121" width="272" height="242" rx="51" fill="none" stroke="#6d9ed3" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-125" y="-110" width="250" height="220" rx="40" fill="url(#hBezel)" stroke="#141c29" stroke-width="1.5"/>
      
      
      <rect x="-94" y="-83" width="188" height="174" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-91" y="-80" width="182" height="168" fill="#b8c4a8"/><rect x="55" y="-68.5" width="15" height="15" fill="#98a488"/><rect x="50" y="-63.5" width="25" height="5" fill="#98a488"/><rect x="55" y="-73.5" width="15" height="5" fill="#98a488"/><rect x="-75" y="-63.5" width="25" height="5" fill="#98a488"/><rect x="-70" y="-68.5" width="15" height="5" fill="#98a488"/><rect x="-90" y="16.5" width="5" height="70" fill="#4a5444"/><rect x="-85" y="16.5" width="5" height="70" fill="#4a5444"/><rect x="-80" y="21.5" width="5" height="65" fill="#4a5444"/><rect x="-75" y="21.5" width="5" height="65" fill="#4a5444"/><rect x="-70" y="26.5" width="5" height="60" fill="#4a5444"/><rect x="-65" y="26.5" width="5" height="60" fill="#4a5444"/><rect x="-60" y="26.5" width="5" height="60" fill="#4a5444"/><rect x="-55" y="31.5" width="5" height="55" fill="#4a5444"/><rect x="-50" y="41.5" width="5" height="45" fill="#4a5444"/><rect x="-45" y="46.5" width="5" height="40" fill="#4a5444"/><rect x="-40" y="51.5" width="5" height="35" fill="#4a5444"/><rect x="-35" y="51.5" width="5" height="35" fill="#4a5444"/><rect x="-30" y="46.5" width="5" height="40" fill="#4a5444"/><rect x="-25" y="41.5" width="5" height="45" fill="#4a5444"/><rect x="-20" y="41.5" width="5" height="45" fill="#4a5444"/><rect x="-15" y="36.5" width="5" height="50" fill="#4a5444"/><rect x="-10" y="36.5" width="5" height="50" fill="#4a5444"/><rect x="-5" y="31.5" width="5" height="55" fill="#4a5444"/><rect x="0" y="26.5" width="5" height="60" fill="#4a5444"/><rect x="5" y="16.5" width="5" height="70" fill="#4a5444"/><rect x="10" y="11.5" width="5" height="75" fill="#4a5444"/><rect x="15" y="11.5" width="5" height="75" fill="#4a5444"/><rect x="20" y="16.5" width="5" height="70" fill="#4a5444"/><rect x="25" y="26.5" width="5" height="60" fill="#4a5444"/><rect x="30" y="31.5" width="5" height="55" fill="#4a5444"/><rect x="35" y="31.5" width="5" height="55" fill="#4a5444"/><rect x="40" y="36.5" width="5" height="50" fill="#4a5444"/><rect x="45" y="36.5" width="5" height="50" fill="#4a5444"/><rect x="50" y="41.5" width="5" height="45" fill="#4a5444"/><rect x="55" y="46.5" width="5" height="40" fill="#4a5444"/><rect x="60" y="51.5" width="5" height="35" fill="#4a5444"/><rect x="65" y="56.5" width="5" height="30" fill="#4a5444"/><rect x="70" y="51.5" width="5" height="35" fill="#4a5444"/><rect x="75" y="41.5" width="5" height="45" fill="#4a5444"/><rect x="80" y="36.5" width="5" height="50" fill="#4a5444"/><rect x="85" y="31.5" width="5" height="55" fill="#4a5444"/><rect x="-90" y="61.5" width="180" height="25" fill="#1c241a"/><rect x="-90" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-75" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-70" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-55" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-50" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-35" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-30" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-15" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-10" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="5" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="10" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="25" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="30" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="45" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="50" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="65" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="70" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="85" y="61.5" width="5" height="5" fill="#4a5444"/><rect x="-35" y="46.5" width="10" height="15" fill="#1c241a"/><rect x="-35" y="41.5" width="10" height="5" fill="#98a488"/><rect x="10" y="26.5" width="30" height="5" fill="#1c241a"/><rect x="20" y="11.5" width="10" height="10" fill="#98a488"/></g>
      <rect x="-91" y="-80" width="182" height="168" fill="url(#glass)"/>
      <circle cx="-109" cy="-12.8" r="5" fill="url(#hLed)"/><circle cx="-109" cy="-12.8" r="13" fill="#f5c61b" opacity=".18"/></g>

      <rect width="856" height="540" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
