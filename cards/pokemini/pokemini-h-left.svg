        <rect x="156" y="0" width="30" height="540" fill="url(#spineShade)"/>
        <rect x="0" y="0" width="156" height="540" fill="url(#spineG)"/>
        
        <rect x="154.8" y="0" width="1.2" height="540" fill="#6d8fb9" opacity=".6"/>
