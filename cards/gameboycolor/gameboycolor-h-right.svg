        <rect x="670" y="0" width="30" height="540" fill="url(#spineShade)"/>
        <rect x="700" y="0" width="156" height="540" fill="url(#spineG)"/>
        
        <rect x="700" y="0" width="1.2" height="540" fill="#8d78b0" opacity=".6"/>
