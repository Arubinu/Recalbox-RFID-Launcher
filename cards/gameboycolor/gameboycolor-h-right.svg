      <rect x="0" y="0" width="856" height="540" fill="url(#tex)" opacity="0.12" />
      <rect width="856" height="540" filter="url(#noise)"/>

      <!-- encadré de la jaquette -->
      <g mask="url(#noCarve)">
        <path d="M40 24 H456 Q472 24 472 40 V434 Q472 450 456 450 H40 Q24 450 24 434 V40 Q24 24 40 24 Z" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7" transform="translate(0 2)"/>
        <path d="M40 24 H456 Q472 24 472 40 V434 Q472 450 456 450 H40 Q24 450 24 434 V40 Q24 24 40 24 Z" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>
      <g clip-path="url(#win)">
        <rect x="358" y="115" width="354" height="294" rx="54" fill="none" stroke="#000" stroke-width="14" stroke-opacity="0.7"/>
        <rect x="358" y="115" width="354" height="294" rx="54" fill="none" stroke="url(#frameG)" stroke-width="3.2"/>
      </g>

      <!-- détails -->
      <g id="aux1"><circle cx="525" cy="61" r="32" fill="#563285"/>
      <path d="M516 34 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z" fill="#1e1e22" stroke="#0f0f11" filter="url(#soft)"/>
      <circle cx="525" cy="61" r="5.3999999999999995" fill="#121214"/></g>
      <g id="aux2"><defs><radialGradient id="ab460" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#828286"/><stop offset=".55" stop-color="#2e2e36"/><stop offset="1" stop-color="#19191e"/></radialGradient><radialGradient id="ab461" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#828286"/><stop offset=".55" stop-color="#2e2e36"/><stop offset="1" stop-color="#19191e"/></radialGradient></defs><rect x="498" y="485" width="30" height="9" rx="4.5" fill="#3a2560" transform="rotate(-25 513 489)"/><rect x="536" y="485" width="30" height="9" rx="4.5" fill="#3a2560" transform="rotate(-25 551 489)"/><circle cx="615.6" cy="496" r="19" fill="url(#ab460)" filter="url(#soft)"/><circle cx="661" cy="482" r="19" fill="url(#ab461)" filter="url(#soft)"/></g>

      <!-- motif principal -->
      <g id="hero" transform="translate(535 262) scale(1)"><defs><linearGradient id="hBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d56b1"/><stop offset=".5" stop-color="#6b3fa6"/><stop offset="1" stop-color="#563285"/></linearGradient><linearGradient id="hBezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3b43"/><stop offset="1" stop-color="#22222a"/></linearGradient><radialGradient id="hLed" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#99ffb3"/><stop offset=".5" stop-color="#3f6"/><stop offset="1" stop-color="#1f993d"/></radialGradient><linearGradient id="hGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect x="-157" y="-127" width="314" height="254" rx="34" fill="url(#hBody)" filter="url(#drop)"/>
      <rect x="-156" y="-126" width="312" height="252" rx="33" fill="none" stroke="#9779c1" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="-145" y="-115" width="290" height="230" rx="22" fill="url(#hBezel)" stroke="#17171c" stroke-width="1.5"/>
      
      <rect x="-131" y="-107" width="262" height="2.2" fill="#e3262e"/><rect x="-131" y="-102" width="262" height="2.2" fill="#f5c61b"/><rect x="-131" y="-97" width="262" height="2.2" fill="#22a84a"/><rect x="-131" y="-92" width="262" height="2.2" fill="#2a63d6"/><text x="0" y="-96" text-anchor="middle" font-family="'Segoe UI',Arial" font-style="italic" font-weight="700" font-size="10" letter-spacing="1.5" fill="#fff">COLOR</text>
      <rect x="-114" y="-88" width="228" height="184" rx="4" fill="#000" opacity=".55"/>
      <g><rect x="-111" y="-85" width="222" height="178" fill="#7ec8ff"/><rect x="69" y="-71" width="18" height="18" fill="#fff3a8"/><rect x="63" y="-65" width="30" height="6" fill="#fff3a8"/><rect x="69" y="-77" width="18" height="6" fill="#fff3a8"/><rect x="-93" y="-65" width="30" height="6" fill="#fff3a8"/><rect x="-87" y="-71" width="18" height="6" fill="#fff3a8"/><rect x="-111" y="25" width="6" height="66" fill="#3fae4b"/><rect x="-105" y="25" width="6" height="66" fill="#3fae4b"/><rect x="-99" y="31" width="6" height="60" fill="#3fae4b"/><rect x="-93" y="31" width="6" height="60" fill="#3fae4b"/><rect x="-87" y="31" width="6" height="60" fill="#3fae4b"/><rect x="-81" y="37" width="6" height="54" fill="#3fae4b"/><rect x="-75" y="49" width="6" height="42" fill="#3fae4b"/><rect x="-69" y="55" width="6" height="36" fill="#3fae4b"/><rect x="-63" y="55" width="6" height="36" fill="#3fae4b"/><rect x="-57" y="55" width="6" height="36" fill="#3fae4b"/><rect x="-51" y="49" width="6" height="42" fill="#3fae4b"/><rect x="-45" y="43" width="6" height="48" fill="#3fae4b"/><rect x="-39" y="37" width="6" height="54" fill="#3fae4b"/><rect x="-33" y="37" width="6" height="54" fill="#3fae4b"/><rect x="-27" y="31" width="6" height="60" fill="#3fae4b"/><rect x="-21" y="31" width="6" height="60" fill="#3fae4b"/><rect x="-15" y="25" width="6" height="66" fill="#3fae4b"/><rect x="-9" y="19" width="6" height="72" fill="#3fae4b"/><rect x="-3" y="13" width="6" height="78" fill="#3fae4b"/><rect x="3" y="13" width="6" height="78" fill="#3fae4b"/><rect x="9" y="25" width="6" height="66" fill="#3fae4b"/><rect x="15" y="31" width="6" height="60" fill="#3fae4b"/><rect x="21" y="37" width="6" height="54" fill="#3fae4b"/><rect x="27" y="43" width="6" height="48" fill="#3fae4b"/><rect x="33" y="43" width="6" height="48" fill="#3fae4b"/><rect x="39" y="43" width="6" height="48" fill="#3fae4b"/><rect x="45" y="49" width="6" height="42" fill="#3fae4b"/><rect x="51" y="55" width="6" height="36" fill="#3fae4b"/><rect x="57" y="55" width="6" height="36" fill="#3fae4b"/><rect x="63" y="55" width="6" height="36" fill="#3fae4b"/><rect x="69" y="49" width="6" height="42" fill="#3fae4b"/><rect x="75" y="37" width="6" height="54" fill="#3fae4b"/><rect x="81" y="31" width="6" height="60" fill="#3fae4b"/><rect x="87" y="25" width="6" height="66" fill="#3fae4b"/><rect x="93" y="25" width="6" height="66" fill="#3fae4b"/><rect x="99" y="25" width="6" height="66" fill="#3fae4b"/><rect x="105" y="25" width="6" height="66" fill="#3fae4b"/><rect x="-111" y="61" width="222" height="30" fill="#8a4b1f"/><rect x="-111" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-93" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-87" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-69" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-63" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-45" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-39" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-21" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-15" y="61" width="6" height="6" fill="#3fae4b"/><rect x="3" y="61" width="6" height="6" fill="#3fae4b"/><rect x="9" y="61" width="6" height="6" fill="#3fae4b"/><rect x="27" y="61" width="6" height="6" fill="#3fae4b"/><rect x="33" y="61" width="6" height="6" fill="#3fae4b"/><rect x="51" y="61" width="6" height="6" fill="#3fae4b"/><rect x="57" y="61" width="6" height="6" fill="#3fae4b"/><rect x="75" y="61" width="6" height="6" fill="#3fae4b"/><rect x="81" y="61" width="6" height="6" fill="#3fae4b"/><rect x="99" y="61" width="6" height="6" fill="#3fae4b"/><rect x="105" y="61" width="6" height="6" fill="#3fae4b"/><rect x="-45" y="43" width="12" height="18" fill="#8a4b1f"/><rect x="-45" y="37" width="12" height="6" fill="#fff3a8"/><rect x="9" y="19" width="36" height="6" fill="#8a4b1f"/><rect x="27" y="1" width="12" height="12" fill="#fff3a8"/></g>
      <rect x="-111" y="-85" width="222" height="178" fill="url(#glass)"/>
      <circle cx="-129" cy="-13.8" r="5" fill="url(#hLed)"/><circle cx="-129" cy="-13.8" r="13" fill="#3f6" opacity=".18"/></g>

      <rect width="856" height="540" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
