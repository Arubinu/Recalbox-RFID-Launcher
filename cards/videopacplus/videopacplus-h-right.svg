      <g id="hero" transform="translate(537 262) scale(1)"><defs><linearGradient id="hCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#444447"/><stop offset=".5" stop-color="#2a2a2e"/><stop offset="1" stop-color="#212124"/></linearGradient></defs>
      <rect x="-155" y="-105" width="310" height="210" rx="22" fill="url(#hCase)" filter="url(#drop)"/>
      <rect x="-139" y="-89" width="278" height="178" rx="10" fill="#1a1a1d"/>
      <rect x="-127.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-106" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-84.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-63" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-41.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-20" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="1.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="23" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="44.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="66" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="87.5" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="109" y="-77.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-118.9" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-97.4" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-75.9" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-54.4" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-32.9" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-11.4" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="10.1" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="31.6" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="53.1" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="74.6" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="96.1" y="-38" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-127.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-106" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-84.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-63" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-41.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-20" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="1.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="23" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="44.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="66" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="87.5" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="109" y="1.5" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-127.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-106" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-84.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-63" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-41.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="-20" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="1.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="23" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="44.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="66" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="87.5" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/><rect x="109" y="41" width="18.5" height="36.5" rx="2" fill="#d9d9de" stroke="#8d8d90" stroke-width=".8"/></g>

      <rect width="856" height="540" fill="url(#sheen)"/>

      <!-- languette (partie qui dépasse du lecteur) -->
      <g id="spine">
        <rect x="670" y="0" width="30" height="540" fill="url(#spineShade)"/>
        <rect x="700" y="0" width="156" height="540" fill="url(#spineG)"/>
        
        <rect x="700" y="0" width="1.2" height="540" fill="#69696a" opacity=".6"/>
