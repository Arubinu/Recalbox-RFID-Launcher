    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="856"><rect width="540" height="856" fill="#fff"/><path d="M40 76 H500 Q516 76 516 92 V492 Q516 508 500 508 H40 Q24 508 24 492 V92 Q24 76 40 76 Z" fill="#000"/><rect x="188" y="420" width="296" height="256" rx="47.2" fill="#fff"/></mask>
    <mask id="noCarve" maskUnits="userSpaceOnUse" x="0" y="0" width="540" height="856"><rect width="540" height="856" fill="#fff"/><rect x="188" y="420" width="296" height="256" rx="47.2" fill="#000"/></mask>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a5c"/><stop offset=".6" stop-color="#2a1f48"/><stop offset="1" stop-color="#1a1230"/></linearGradient>
    <linearGradient id="spineG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0816"/><stop offset=".08" stop-color="#312a45"/><stop offset=".5" stop-color="#1a1230"/><stop offset="1" stop-color="#110c1f"/></linearGradient>
    <linearGradient id="spineShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></linearGradient>
