<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 770" width="100%" role="img" aria-labelledby="wiring-title" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="wiring-title">Wiring of the RC522 reader, the push button and the status light on the Raspberry Pi</title>
<style>:root{--c-bg:#f8f9fa;--c-card:#ffffff;--c-ink:#212529;--c-sub:#495057;--c-faint:#868e96;--c-line:#dee2e6;--c-row:#f1f3f5;--c-alert-bg:#fff5f5;--c-alert-line:#ffc9c9;--c-alert-ink:#c92a2a;--c-good:#2f9e44;}@media (prefers-color-scheme: dark){:root{--c-bg:#0f131b;--c-card:#161b25;--c-ink:#eaeef7;--c-sub:#a8b3c7;--c-faint:#7f8a9e;--c-line:rgba(255, 255, 255, .14);--c-row:rgba(255, 255, 255, .05);--c-alert-bg:rgba(224, 49, 49, .12);--c-alert-line:rgba(224, 49, 49, .38);--c-alert-ink:#ff9b98;--c-good:#37b26c;}}</style>
<rect x="0" y="0" width="940" height="770" rx="14" fill="var(--c-bg)"/>
<text x="30" y="42" font-size="21" font-weight="700" fill="var(--c-ink)">Wiring the RC522 reader, the button and the light</text>
<text x="30" y="66" font-size="13.5" fill="var(--c-sub)">Pin numbers of the 40-pin header of the Raspberry Pi, seen from above (pin 1 is the square one). Wire with the Recalbox off.</text>
<rect x="30" y="80" width="430" height="26" rx="7" fill="var(--c-alert-bg)" stroke="var(--c-alert-line)"/>
<text x="42" y="98" font-size="13" font-weight="600" fill="var(--c-alert-ink)">⚠ 3.3 V only for the reader: 5 V destroys the module.</text>
<rect x="30" y="122" width="430" height="370" rx="12" fill="var(--c-card)" stroke="var(--c-line)"/>
<text x="46" y="148" font-size="15" font-weight="700" fill="var(--c-ink)">RC522 reader (13.56 MHz)</text>
<text x="46" y="166" font-size="11.5" fill="var(--c-faint)">module pin → Raspberry Pi pin</text>
<rect x="46" y="172" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="185" r="5.5" fill="#f08c00"/>
<text x="76" y="190" font-size="12.5" font-weight="650" fill="var(--c-ink)">SDA</text>
<text x="294" y="190" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 24</text>
<text x="432" y="190" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO8 · CE0</text>
<rect x="46" y="201" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="214" r="5.5" fill="#2f9e44"/>
<text x="76" y="219" font-size="12.5" font-weight="650" fill="var(--c-ink)">SCK</text>
<text x="294" y="219" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 23</text>
<text x="432" y="219" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO11 · SCLK</text>
<rect x="46" y="230" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="243" r="5.5" fill="#1971c2"/>
<text x="76" y="248" font-size="12.5" font-weight="650" fill="var(--c-ink)">MOSI</text>
<text x="294" y="248" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 19</text>
<text x="432" y="248" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO10 · MOSI</text>
<rect x="46" y="259" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="272" r="5.5" fill="#7048e8"/>
<text x="76" y="277" font-size="12.5" font-weight="650" fill="var(--c-ink)">MISO</text>
<text x="294" y="277" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 21</text>
<text x="432" y="277" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO9 · MISO</text>
<rect x="46" y="288" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="301" r="5.5" fill="#0c8599"/>
<text x="76" y="306" font-size="12.5" font-weight="650" fill="var(--c-ink)">RST</text>
<text x="294" y="306" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 22</text>
<text x="432" y="306" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO25</text>
<rect x="46" y="317" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="330" r="5.5" fill="#7d8590"/>
<text x="76" y="335" font-size="12.5" font-weight="650" fill="var(--c-ink)">GND</text>
<text x="294" y="335" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 6</text>
<text x="432" y="335" font-size="12" fill="var(--c-sub)" text-anchor="end">GND</text>
<rect x="46" y="346" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="359" r="5.5" fill="#e03131"/>
<text x="76" y="364" font-size="12.5" font-weight="650" fill="var(--c-ink)">3.3V</text>
<text x="294" y="364" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 1</text>
<text x="432" y="364" font-size="12" fill="var(--c-sub)" text-anchor="end">3V3</text>
<rect x="46" y="375" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="388" r="5.5" fill="var(--c-faint)"/>
<text x="76" y="393" font-size="12.5" font-weight="650" fill="var(--c-ink)">IRQ</text>
<text x="432" y="393" font-size="12" fill="var(--c-faint)" text-anchor="end">not connected</text>
<rect x="480" y="122" width="430" height="152" rx="12" fill="var(--c-card)" stroke="var(--c-line)"/>
<text x="496" y="148" font-size="15" font-weight="700" fill="var(--c-ink)">Push button</text>
<text x="496" y="166" font-size="11.5" fill="var(--c-faint)">short press: pair · 3 s: authorize a device</text>
<rect x="496" y="172" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="185" r="5.5" fill="#d6336c"/>
<text x="526" y="190" font-size="12.5" font-weight="650" fill="var(--c-ink)">one leg</text>
<text x="744" y="190" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 11</text>
<text x="882" y="190" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO17</text>
<rect x="496" y="201" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="214" r="5.5" fill="#7d8590"/>
<text x="526" y="219" font-size="12.5" font-weight="650" fill="var(--c-ink)">the other leg</text>
<text x="744" y="219" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 9</text>
<text x="882" y="219" font-size="12" fill="var(--c-sub)" text-anchor="end">GND</text>
<text x="496" y="258" font-size="12" font-weight="600" fill="var(--c-good)">no resistor: the internal pull-up of the Pi is enough</text>
<rect x="480" y="290" width="430" height="202" rx="12" fill="var(--c-card)" stroke="var(--c-line)"/>
<text x="496" y="316" font-size="15" font-weight="700" fill="var(--c-ink)">Status light (optional) · choice 1</text>
<text x="496" y="334" font-size="11.5" fill="var(--c-faint)">RGB LED: one 220 Ω resistor per colour (already on a KY-016 module)</text>
<rect x="496" y="340" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="353" r="5.5" fill="#fa5252"/>
<text x="526" y="358" font-size="12.5" font-weight="650" fill="var(--c-ink)">red</text>
<text x="744" y="358" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 15</text>
<text x="882" y="358" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO22</text>
<rect x="496" y="369" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="382" r="5.5" fill="#40c057"/>
<text x="526" y="387" font-size="12.5" font-weight="650" fill="var(--c-ink)">green</text>
<text x="744" y="387" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 16</text>
<text x="882" y="387" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO23</text>
<rect x="496" y="398" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="411" r="5.5" fill="#4dabf7"/>
<text x="526" y="416" font-size="12.5" font-weight="650" fill="var(--c-ink)">blue</text>
<text x="744" y="416" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 18</text>
<text x="882" y="416" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO24</text>
<rect x="496" y="427" width="398" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="512" cy="440" r="5.5" fill="#7d8590"/>
<text x="526" y="445" font-size="12.5" font-weight="650" fill="var(--c-ink)">common (cathode)</text>
<text x="744" y="445" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 14</text>
<text x="882" y="445" font-size="12" fill="var(--c-sub)" text-anchor="end">GND</text>
<rect x="30" y="508" width="880" height="168" rx="12" fill="var(--c-card)" stroke="var(--c-line)"/>
<text x="46" y="534" font-size="15" font-weight="700" fill="var(--c-ink)">Status light (optional) · choice 2</text>
<text x="46" y="552" font-size="11.5" fill="var(--c-faint)">programmable LEDs (WS2812, SK6812, NeoPixel): no resistor, then restart the Recalbox once</text>
<rect x="46" y="554" width="420" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="567" r="5.5" fill="#fab005"/>
<text x="76" y="572" font-size="12.5" font-weight="650" fill="var(--c-ink)">DIN (data)</text>
<text x="316" y="572" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 38</text>
<text x="454" y="572" font-size="12" fill="var(--c-sub)" text-anchor="end">GPIO20</text>
<rect x="46" y="583" width="420" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="596" r="5.5" fill="#a61e4d"/>
<text x="76" y="601" font-size="12.5" font-weight="650" fill="var(--c-ink)">5V / VCC</text>
<text x="316" y="601" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 2</text>
<text x="454" y="601" font-size="12" fill="var(--c-sub)" text-anchor="end">5V</text>
<rect x="46" y="612" width="420" height="26" rx="7" fill="var(--c-row)"/>
<circle cx="62" cy="625" r="5.5" fill="#7d8590"/>
<text x="76" y="630" font-size="12.5" font-weight="650" fill="var(--c-ink)">GND</text>
<text x="316" y="630" font-size="12.5" font-weight="700" fill="var(--c-ink)">pin 39</text>
<text x="454" y="630" font-size="12" fill="var(--c-sub)" text-anchor="end">GND</text>
<text x="490" y="566" font-size="12.5" fill="var(--c-sub)">• Choose “programmable LEDs” in Settings › Status light:</text>
<text x="502" y="584" font-size="12.5" fill="var(--c-sub)">the second SPI bus is enabled at the next start.</text>
<text x="490" y="608" font-size="12.5" fill="var(--c-sub)">• Pins 12, 35 and 40 are then reserved.</text>
<text x="490" y="632" font-size="12.5" fill="var(--c-sub)">• Many LEDs at full brightness: separate 5 V supply,</text>
<text x="502" y="650" font-size="12.5" fill="var(--c-sub)">GND shared with the Raspberry Pi.</text>
<text x="30" y="712" font-size="12.5" fill="var(--c-sub)">• MISO goes to MISO and MOSI to MOSI: they are not crossed.</text>
<text x="30" y="734" font-size="12.5" fill="var(--c-sub)">• Common-anode RGB LED: the common leg goes to 3V3 (pin 17) instead of GND.</text>
<text x="30" y="756" font-size="12.5" fill="var(--c-sub)">• Badges not read? Run “Test with a badge” in the page: it tells whether a card answers.</text>
</svg>
